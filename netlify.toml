# Netlify Build Configuration for Get Kraken
# Ensures SDK is built before the main app build

[build]
  # Install dependencies, then build (prebuild script will build SDK first)
  # Using npm install instead of npm ci because SDK dependencies are installed during postinstall
  command = "npm install && npm run build"
  # Publish directory
  publish = "dist"

[build.environment]
  # Node version
  NODE_VERSION = "20"

# Redirects for v2 SPA routes (deep-link support)
# All v2 routes are client-side only, handled by React Router
# These redirects ensure deep links work on refresh
# Note: These apply to all branches. Main branch also uses React Router, so this is safe.
[[redirects]]
  from = "/quests/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/rewards/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/calendar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

# Fallback: All other non-file routes go to index.html for SPA routing
# This ensures React Router can handle all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false